@if (points().length === 0) {
  <p class="ranked-empty">{{ emptyMessage() }}</p>
} @else {
  <div class="scatter-legend" role="group" aria-label="Show or hide groups">
    @for (group of groups(); track group.name) {
      <button
        type="button"
        class="legend-chip"
        [class.off]="group.hidden"
        [attr.aria-pressed]="!group.hidden"
        (click)="toggleGroup(group.name)"
      >
        <span class="swatch" [style.background]="group.color"></span>
        {{ group.name }}
        <span class="chip-count">{{ group.count }}</span>
      </button>
    }
  </div>

  <div class="chart-scroll">
    <svg
      class="scatter-chart"
      [attr.viewBox]="'0 0 ' + viewWidth + ' ' + viewHeight"
      role="img"
      [attr.aria-label]="ariaLabel()"
    >
      @for (tick of yTicks(); track $index) {
        <line
          class="gridline"
          [class.baseline]="$first"
          [attr.x1]="leftPadding"
          [attr.x2]="rightEdge"
          [attr.y1]="tick.y"
          [attr.y2]="tick.y"
        />
        <text
          class="tick-label"
          [attr.x]="leftPadding - 8"
          [attr.y]="tick.y + 3.5"
          text-anchor="end"
        >
          {{ tick.label }}
        </text>
      }
      @for (tick of xTicks(); track $index) {
        <text
          class="tick-label"
          [attr.x]="tick.x"
          [attr.y]="axisY + 16"
          text-anchor="middle"
        >
          {{ tick.label }}
        </text>
      }
      <text
        class="axis-title"
        [attr.x]="(leftPadding + rightEdge) / 2"
        [attr.y]="viewHeight - 6"
        text-anchor="middle"
      >
        {{ xLabel() }}
      </text>
      <text
        class="axis-title"
        [attr.transform]="
          'translate(12,' + (topPadding + axisY) / 2 + ') rotate(-90)'
        "
        text-anchor="middle"
      >
        {{ yLabel() }}
      </text>

      @if (trendLine(); as trend) {
        <line
          class="trend-line"
          [attr.x1]="trend.x1"
          [attr.y1]="trend.y1"
          [attr.x2]="trend.x2"
          [attr.y2]="trend.y2"
        />
      }

      @for (dot of dots(); track dot.key) {
        <circle
          class="dot"
          [class.active]="activeKey() === dot.key"
          [style.--i]="$index"
          [attr.cx]="dot.cx"
          [attr.cy]="dot.cy"
          r="7"
          [attr.fill]="dot.color"
          (pointerenter)="setActive(dot.key)"
          (pointerleave)="setActive(null)"
        />
      }

      @if (tooltip(); as tip) {
        <g
          class="chart-tooltip"
          [attr.transform]="'translate(' + tip.x + ',' + tip.y + ')'"
        >
          <rect [attr.width]="tip.width" [attr.height]="tooltipHeight" rx="8" />
          <text class="chart-tooltip-label" x="12" y="17">
            {{ tip.dot.group }}
          </text>
          <text class="chart-tooltip-value" x="12" y="34">
            {{ tip.dot.yText }}
          </text>
          <text class="chart-tooltip-label" x="12" y="49">
            {{ tip.dot.xText }}
          </text>
        </g>
      }
    </svg>
  </div>

  @if (trendSummary(); as summary) {
    <p class="trend-summary">
      <span class="trend-key" aria-hidden="true"></span>{{ summary }}
    </p>
  }
}
