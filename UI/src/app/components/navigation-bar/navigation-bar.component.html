@if (showNavbar()) {
  <nav
    class="navbar navbar-expand-sm navbar-dark gradient-custom"
    aria-label="Main"
  >
    <div class="container-fluid">
      <a
        class="navbar-brand"
        routerLink="employees"
        aria-label="Employee Management System, employees"
      >
        <img
          id="navbarBrand"
          class="hoverBrand"
          src="/assets/DanFrunzaLogo_Mini.png"
          alt=""
        />
      </a>
      <button
        class="navbar-toggler"
        type="button"
        aria-controls="primary-nav"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle navigation"
        (click)="toggleMenu()"
      >
        <span class="toggler-bars" aria-hidden="true"
          ><span></span><span></span><span></span
        ></span>
      </button>
      <div
        class="navbar-collapse justify-content-between"
        [class.open]="menuOpen()"
        id="primary-nav"
      >
        <div class="navbar-menu">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="employees"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                (click)="closeMenu()"
                >Employees</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="audit-log"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                (click)="closeMenu()"
                >Audit log</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="offices"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                (click)="closeMenu()"
                >Offices</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="departments"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                (click)="closeMenu()"
                >Departments</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="cost-centers"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                (click)="closeMenu()"
                >Cost centers</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="about"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                (click)="closeMenu()"
                >About</a
              >
            </li>
          </ul>
          <button type="button" class="nav-link nav-logout" (click)="logout()">
            Log out
          </button>
        </div>
      </div>
    </div>
  </nav>
}
