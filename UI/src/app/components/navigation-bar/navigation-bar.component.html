@if (showNavbar()) {
  <nav
    class="navbar navbar-expand-sm navbar-dark gradient-custom"
    aria-label="Main"
  >
    <div class="container-fluid">
      <a
        class="navbar-brand"
        routerLink="employees"
        aria-label="Employee Management System, employees"
      >
        <img
          id="navbarBrand"
          class="hoverBrand"
          src="/assets/DanFrunzaLogo_Mini.png"
          alt=""
        />
      </a>
      <button
        class="navbar-toggler"
        type="button"
        aria-controls="primary-nav"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle navigation"
        (click)="toggleMenu()"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div
        class="navbar-collapse justify-content-between"
        [class.collapse]="!menuOpen()"
        id="primary-nav"
      >
        <ul class="navbar-nav">
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="employees"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              (click)="closeMenu()"
              >Employees</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="audit-log"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              (click)="closeMenu()"
              >Audit Log</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="offices"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              (click)="closeMenu()"
              >Offices</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="departments"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              (click)="closeMenu()"
              >Departments</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="cost-centers"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              (click)="closeMenu()"
              >Cost Centers</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="about"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              (click)="closeMenu()"
              >About</a
            >
          </li>
        </ul>
        <button type="button" class="nav-link nav-logout" (click)="logout()">
          Log out
        </button>
      </div>
    </div>
  </nav>
}
