<form [formRoot]="employeeForm">
  <div class="page">
    <div class="page-header">
      <div>
        <h1 class="page-title">Edit employee</h1>
        <p class="page-subtitle">Update the employee's details and address.</p>
      </div>
    </div>

    @if (isLoading()) {
    <div class="app-card loading-state mb-4" role="status">
      <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Loading
      employee…
    </div>
    } @if (errorMessage() && !isLoading()) {
    <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
    } @if (invalidSummary(); as summary) {
    <div class="alert alert-danger" role="alert">{{ summary }}</div>
    }

    <app-employee-form-fields [form]="employeeForm" />

    <div class="form-actions mt-4">
      <button type="submit" class="btn btn-primary" [disabled]="employeeForm().submitting()">
        @if (employeeForm().submitting()) {
        <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
        } Save changes
      </button>
      <a routerLink="/employees" class="btn btn-link">Cancel</a>
    </div>

    @if (saveError(); as error) {
    <div class="alert alert-danger mt-3" role="alert">{{ error }}</div>
    }
  </div>
</form>
